apply plugin: 'com.android.application'

def normalizedEnvironmentValue = { String name ->
    def value = System.getenv(name)
    value == null || value.trim().isEmpty() ? null : value.trim()
}
def requestedReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
def configuredVersionName = normalizedEnvironmentValue('ALTGRID_ANDROID_VERSION_NAME')
def configuredVersionCode = normalizedEnvironmentValue('ALTGRID_ANDROID_VERSION_CODE')
def appVersionName = configuredVersionName ?: '1.5.5'
def appVersionCode = configuredVersionCode == null ? 10505 : Integer.parseInt(configuredVersionCode)
if (!(appVersionName ==~ /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/)) {
    throw new GradleException('ALTGRID_ANDROID_VERSION_NAME precisa ser uma versão SemVer válida.')
}
if (appVersionCode <= 0 || appVersionCode > 2100000000) {
    throw new GradleException('ALTGRID_ANDROID_VERSION_CODE precisa estar entre 1 e 2100000000.')
}

def androidSigningValues = [
    path: normalizedEnvironmentValue('ALTGRID_ANDROID_KEYSTORE_PATH'),
    storePassword: normalizedEnvironmentValue('ALTGRID_ANDROID_KEYSTORE_PASSWORD'),
    alias: normalizedEnvironmentValue('ALTGRID_ANDROID_KEY_ALIAS'),
    keyPassword: normalizedEnvironmentValue('ALTGRID_ANDROID_KEY_PASSWORD'),
]
def androidSigningConfigured = androidSigningValues.values().every { it != null }

android {
    namespace = "io.altgrid.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.altgrid.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (androidSigningConfigured) {
                storeFile file(androidSigningValues.path)
                storePassword androidSigningValues.storePassword
                keyAlias androidSigningValues.alias
                keyPassword androidSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Preview builds must coexist with the officially signed app so a
            // tester never needs to uninstall the production installation.
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (requestedReleaseBuild && !androidSigningConfigured) {
    throw new GradleException(
        'A assinatura Android release é obrigatória. Configure ALTGRID_ANDROID_KEYSTORE_PATH, ' +
        'ALTGRID_ANDROID_KEYSTORE_PASSWORD, ALTGRID_ANDROID_KEY_ALIAS e ALTGRID_ANDROID_KEY_PASSWORD.'
    )
}
if (requestedReleaseBuild && !file(androidSigningValues.path).isFile()) {
    throw new GradleException('ALTGRID_ANDROID_KEYSTORE_PATH não aponta para um arquivo válido.')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ALTGRID_API_BASE_URL: ${{ vars.ALTGRID_API_BASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      LICENSE_KEY_ID: ${{ vars.LICENSE_KEY_ID }}
      RELEASE_TAG: ${{ github.ref_name }}
      ALTGRID_RELEASE_TYPE: ${{ contains(github.ref_name, '-') && 'prerelease' || 'release' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET for Velopack
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release configuration
        run: pnpm release:preflight

      - name: Validate project
        run: |
          pnpm typecheck
          pnpm test:run

      - name: Smoke test staging API
        env:
          ALTGRID_STAGING_API_BASE_URL: ${{ vars.ALTGRID_STAGING_API_BASE_URL }}
          ALTGRID_SMOKE_ORIGIN: ${{ vars.ALTGRID_SMOKE_ORIGIN }}
        run: pnpm smoke:staging

      - name: Build renderer and Electron
        run: |
          pnpm exec vite build --mode desktop
          pnpm desktop:compile

      - name: Build Microsoft Store package
        run: node scripts/package-store.mjs

      - name: Configure Android release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $requiredValues = @{
            ANDROID_KEYSTORE_BASE64 = $env:ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD = $env:ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS = $env:ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD = $env:ANDROID_KEY_PASSWORD
          }
          foreach ($entry in $requiredValues.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Secret Android obrigatório ausente: $($entry.Key)."
            }
            if ($entry.Value -match "[`r`n]") {
              throw "Secret Android inválido: $($entry.Key) contém quebra de linha."
            }
          }

          $versionName = $env:RELEASE_TAG.Substring(1)
          if ($versionName -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Tag Android inválida: $($env:RELEASE_TAG)."
          }
          $runNumber = [int64]$env:GITHUB_RUN_NUMBER
          $runAttempt = [Math]::Min([int64]$env:GITHUB_RUN_ATTEMPT, 9)
          $versionCode = 1000000 + ($runNumber * 10) + $runAttempt
          if ($versionCode -gt 2100000000) {
            throw "O versionCode Android excedeu o limite da plataforma."
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "altgrid-android-release.jks"
          try {
            $keystoreBytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
            [IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 não contém um keystore base64 válido."
          }

          "ALTGRID_ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEYSTORE_PASSWORD=$env:ANDROID_KEYSTORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEY_ALIAS=$env:ANDROID_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEY_PASSWORD=$env:ANDROID_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_VERSION_CODE=$versionCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Android release
        shell: pwsh
        run: |
          pnpm android:sync
          Push-Location android
          .\gradlew.bat assembleRelease
          Pop-Location

      - name: Configure optional Windows signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -ne $hasPassword) {
            throw "Configure WINDOWS_CERTIFICATE_BASE64 e WINDOWS_CERTIFICATE_PASSWORD juntos."
          }

          if (-not $hasCertificate) {
            Write-Output "Assinatura Windows opcional não configurada."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "altgrid-code-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 não contém um certificado base64 válido."
          }

          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Assinatura Windows opcional habilitada."

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ALTGRID_RELEASES_TOKEN }}
        run: |
          node scripts/package-desktop.mjs

          $androidArtifact = "release/AltGrid-Android-$($env:RELEASE_TAG.Substring(1)).apk"
          Copy-Item -LiteralPath "android/app/build/outputs/apk/release/app-release.apk" -Destination $androidArtifact

          $storeArtifact = "store-release/AltGrid-Store-$($env:RELEASE_TAG.Substring(1)).appx"

          $releaseRepo = "acvisualdigital/altgrid-releases"
          $releaseTag = $env:RELEASE_TAG
          $releaseArgs = @(
            $releaseTag,
            "--repo", $releaseRepo,
            "--title", "AltGrid $releaseTag",
            "--target", "main"
          )
          if ($env:ALTGRID_RELEASE_TYPE -eq "prerelease") {
            $releaseArgs += "--prerelease"
          }

          gh release view $releaseTag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create @releaseArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível criar a release $releaseTag."
            }
          }

          $artifacts = @(
            "release/AltGrid-Android-$($env:RELEASE_TAG.Substring(1)).apk",
            $storeArtifact
          )
          $artifacts += @(Get-ChildItem -LiteralPath "release/velopack" -File | ForEach-Object { $_.FullName })
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Artefato ausente: $artifact"
            }
          }
          gh release upload $releaseTag @artifacts --repo $releaseRepo --clobber

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $certificatePath = [IO.Path]::GetFullPath(
            (Join-Path $temporaryRoot "altgrid-code-signing.pfx")
          )
          $temporaryPrefix = $temporaryRoot.TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + [IO.Path]::DirectorySeparatorChar

          if (-not $certificatePath.StartsWith(
            $temporaryPrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Caminho temporário do certificado inválido."
          }

          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

          $androidKeystorePath = [IO.Path]::GetFullPath(
            (Join-Path $temporaryRoot "altgrid-android-release.jks")
          )
          if (-not $androidKeystorePath.StartsWith(
            $temporaryPrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Caminho temporário do keystore Android inválido."
          }
          if (Test-Path -LiteralPath $androidKeystorePath) {
            Remove-Item -LiteralPath $androidKeystorePath -Force
          }

name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer do Windows (ex.: 1.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ALTGRID_API_BASE_URL: ${{ vars.ALTGRID_API_BASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      LICENSE_KEY_ID: ${{ vars.LICENSE_KEY_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET for Velopack
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve Windows version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $versionName = "${{ inputs.version }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("windows-v")) {
              throw "Tag Windows inválida: $tag"
            }
            $versionName = $tag.Substring("windows-v".Length)
          }

          if ($versionName -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Versão Windows inválida: $versionName"
          }

          "WINDOWS_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Windows release
        run: |
          pnpm release:preflight
          pnpm typecheck
          pnpm test:run

      - name: Smoke test staging API
        env:
          ALTGRID_STAGING_API_BASE_URL: ${{ vars.ALTGRID_STAGING_API_BASE_URL }}
          ALTGRID_SMOKE_ORIGIN: ${{ vars.ALTGRID_SMOKE_ORIGIN }}
        run: pnpm smoke:staging

      - name: Build renderer and Electron
        run: |
          pnpm exec vite build --mode desktop
          pnpm desktop:compile

      - name: Configure optional Windows signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -ne $hasPassword) {
            throw "Configure WINDOWS_CERTIFICATE_BASE64 e WINDOWS_CERTIFICATE_PASSWORD juntos."
          }
          if (-not $hasCertificate) {
            Write-Output "Assinatura Windows opcional não configurada."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "altgrid-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 não contém um certificado base64 válido."
          }

          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ALTGRID_RELEASES_TOKEN }}
        run: |
          node scripts/package-desktop.mjs

          $releaseRepo = "acvisualdigital/altgrid-releases"
          gh release view $env:RELEASE_TAG --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $releaseRepo --title "AltGrid $($env:RELEASE_TAG)" --target main
            if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível criar a release $($env:RELEASE_TAG)."
            }
          }

          $artifacts = @(Get-ChildItem -LiteralPath "release/velopack" -File | ForEach-Object { $_.FullName })
          if ($artifacts.Count -eq 0) {
            throw "Nenhum artefato Velopack foi gerado."
          }
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Artefato ausente: $artifact"
            }
          }
          gh release upload $env:RELEASE_TAG @artifacts --repo $releaseRepo --clobber

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $certificatePath = [IO.Path]::GetFullPath(
            (Join-Path $temporaryRoot "altgrid-code-signing.pfx")
          )
          $temporaryPrefix = $temporaryRoot.TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + [IO.Path]::DirectorySeparatorChar

          if (-not $certificatePath.StartsWith(
            $temporaryPrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Caminho temporário do certificado inválido."
          }
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer a gerar (ex.: 1.5.5)"
        required: true
        default: "1.5.5"
      publish:
        description: "Enviar os pacotes para a release pública depois dos testes"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ALTGRID_API_BASE_URL: ${{ vars.ALTGRID_API_BASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      LICENSE_KEY_ID: ${{ vars.LICENSE_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report Apple distribution mode
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Developer ID e notarização habilitados."
          else
            echo "Sem credenciais Apple: será usada assinatura ad-hoc e autorização manual do Gatekeeper."
          fi

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json');if(p.version!==process.env.REQUESTED_VERSION)throw new Error('package.json não corresponde à versão solicitada')"

      - name: Validate target release before publishing
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.ALTGRID_RELEASES_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          gh release view "v${REQUESTED_VERSION}" --repo acvisualdigital/altgrid-releases

      - name: Validate project
        run: |
          pnpm typecheck
          pnpm test:run

      - name: Build Apple Silicon package
        run: pnpm mac:build
        env:
          ALTGRID_MAC_ARCH: arm64

      - name: Build Intel package
        run: pnpm mac:build
        env:
          ALTGRID_MAC_ARCH: x64

      - name: Verify macOS packages
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          for arch in arm64 x64; do
            dmg="release/mac/AltGrid-mac-${arch}-${REQUESTED_VERSION}.dmg"
            zip="release/mac/AltGrid-mac-${arch}-${REQUESTED_VERSION}.zip"
            test -s "$dmg"
            test -s "$zip"
            hdiutil verify "$dmg"
            unzip -tq "$zip"

            mount_point="${RUNNER_TEMP}/altgrid-${arch}"
            mkdir -p "$mount_point"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
            plutil -lint "$mount_point/AltGrid.app/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=2 "$mount_point/AltGrid.app"
            binary_info="$(file "$mount_point/AltGrid.app/Contents/MacOS/AltGrid")"
            echo "$binary_info"
            echo "$binary_info" | grep -q "$arch"
            hdiutil detach "$mount_point"
          done

      - name: Keep macOS packages for private review
        uses: actions/upload-artifact@v4
        with:
          name: AltGrid-macOS-${{ inputs.version }}
          path: release/mac/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS packages
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.ALTGRID_RELEASES_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: gh release upload "v${REQUESTED_VERSION}" release/mac/* --repo acvisualdigital/altgrid-releases --clobber

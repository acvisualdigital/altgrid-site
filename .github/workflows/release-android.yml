name: Release Android

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer do Android (ex.: 1.0.2)"
        required: true
        type: string
      publish:
        description: "Enviar o APK para a release pública depois dos testes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ALTGRID_API_BASE_URL: ${{ vars.ALTGRID_API_BASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      LICENSE_KEY_ID: ${{ vars.LICENSE_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Android version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $versionName = "${{ inputs.version }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("android-v")) {
              throw "Tag Android inválida: $tag"
            }
            $versionName = $tag.Substring("android-v".Length)
          }

          if ($versionName -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Versão Android inválida: $versionName"
          }

          $releaseTag = "v$versionName"
          $releaseType = if ($versionName.Contains("-")) { "prerelease" } else { "release" }
          $runAttempt = [Math]::Min([int64]"${{ github.run_attempt }}", 9)
          $versionCode = 2000000 + ([int64]"${{ github.run_number }}" * 10) + $runAttempt

          "ANDROID_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_VERSION_CODE=$versionCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_RELEASE_TYPE=$releaseType" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Android release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $requiredValues = @{
            ANDROID_KEYSTORE_BASE64 = $env:ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD = $env:ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS = $env:ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD = $env:ANDROID_KEY_PASSWORD
          }
          foreach ($entry in $requiredValues.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Secret Android obrigatório ausente: $($entry.Key)."
            }
            if ($entry.Value -match "[`r`n]") {
              throw "Secret Android inválido: $($entry.Key) contém quebra de linha."
            }
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "altgrid-android-release.jks"
          try {
            $keystoreBytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
            [IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 não contém um keystore base64 válido."
          }

          "ALTGRID_ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEYSTORE_PASSWORD=$env:ANDROID_KEYSTORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEY_ALIAS=$env:ANDROID_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALTGRID_ANDROID_KEY_PASSWORD=$env:ANDROID_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Android release
        run: |
          pnpm release:preflight
          pnpm typecheck
          pnpm test:run

      - name: Build signed Android APK
        shell: pwsh
        run: |
          pnpm android:sync
          Push-Location android
          .\gradlew.bat testReleaseUnitTest lintRelease assembleRelease
          Pop-Location

      - name: Prepare Android package
        shell: pwsh
        run: |
          $artifact = "release/AltGrid-Android-$($env:ANDROID_VERSION_NAME).apk"
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item -LiteralPath "android/app/build/outputs/apk/release/app-release.apk" -Destination $artifact

      - name: Keep Android package for private review
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: AltGrid-Android-${{ env.ANDROID_VERSION_NAME }}
          path: release/AltGrid-Android-${{ env.ANDROID_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Android release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ALTGRID_RELEASES_TOKEN }}
        run: |
          $artifact = "release/AltGrid-Android-$($env:ANDROID_VERSION_NAME).apk"
          $releaseRepo = "acvisualdigital/altgrid-releases"
          $releaseArgs = @(
            $env:RELEASE_TAG,
            "--repo", $releaseRepo,
            "--title", "AltGrid $($env:RELEASE_TAG)",
            "--target", "main"
          )
          if ($env:ALTGRID_RELEASE_TYPE -eq "prerelease") {
            $releaseArgs += "--prerelease"
          }

          gh release view $env:RELEASE_TAG --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create @releaseArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível criar a release $($env:RELEASE_TAG)."
            }
          }

          gh release upload $env:RELEASE_TAG $artifact --repo $releaseRepo --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível publicar o APK Android."
          }

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $keystorePath = [IO.Path]::GetFullPath(
            (Join-Path $temporaryRoot "altgrid-android-release.jks")
          )
          $temporaryPrefix = $temporaryRoot.TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + [IO.Path]::DirectorySeparatorChar

          if (-not $keystorePath.StartsWith(
            $temporaryPrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Caminho temporário do keystore Android inválido."
          }
          if (Test-Path -LiteralPath $keystorePath) {
            Remove-Item -LiteralPath $keystorePath -Force
          }
